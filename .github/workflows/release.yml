name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.1)
        required: true
        type: string
  push:
    tags: ['v*']
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        shell: pwsh
        run: |
          $env:GITHUB_REF_NAME = $env:RELEASE_TAG
          node scripts/validate-release.cjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prepare Electron runtime
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:package
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $release = Get-Content latest-release.json -Raw | ConvertFrom-Json
          $folder = Split-Path $release.installer
          $assets = Get-ChildItem -LiteralPath $folder -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -in @('latest.yml', 'alpha.yml', 'beta.yml') } | ForEach-Object { $_.FullName }
          $sums = $assets | ForEach-Object { $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $(Split-Path $_ -Leaf)" }
          $checksums = Join-Path $folder 'SHA256SUMS.txt'
          $sums | Set-Content -LiteralPath $checksums -Encoding utf8NoBOM
          $assets += $checksums
          $version = $env:RELEASE_TAG.TrimStart('v')
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $start = [Array]::IndexOf($lines, "## $version")
          if ($start -lt 0) { throw "CHANGELOG.md has no notes for $version" }
          $notes = [System.Collections.Generic.List[string]]::new()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('## ')) { break }
            $notes.Add($lines[$i])
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($notes -join "`n").Trim() | Set-Content -LiteralPath $notesFile -Encoding utf8NoBOM
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $displayVersion = if ($package.displayVersion) { $package.displayVersion } else { $version }
          $options = @('release', 'create', $env:RELEASE_TAG, '--title', "Termlume $displayVersion", '--notes-file', $notesFile, '--verify-tag')
          if ($env:RELEASE_TAG.Contains('-')) { $options += '--prerelease' } else { $options += '--latest' }
          & gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            & gh @options @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
